name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SITE_CUSTOM_DOMAIN: ${{ vars.SITE_CUSTOM_DOMAIN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Configure base path
        shell: bash
        run: |
          REPOSITORY_NAME="${GITHUB_REPOSITORY#*/}"
          REPOSITORY_NAME_LOWER="${REPOSITORY_NAME,,}"
          OWNER_NAME_LOWER="${GITHUB_REPOSITORY_OWNER,,}"
          if [[ -n "${SITE_CUSTOM_DOMAIN//[[:space:]]/}" ]]; then
            echo "Custom domain configured: $SITE_CUSTOM_DOMAIN"
            echo "NEXT_PUBLIC_BASE_PATH=" >> "$GITHUB_ENV"
          elif [[ "$REPOSITORY_NAME_LOWER" == "${OWNER_NAME_LOWER}.github.io" ]]; then
            echo "NEXT_PUBLIC_BASE_PATH=" >> "$GITHUB_ENV"
          else
            echo "NEXT_PUBLIC_BASE_PATH=/$REPOSITORY_NAME" >> "$GITHUB_ENV"
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Build
        env:
          NEXT_PUBLIC_EVENT_2026_PHOTOS_URL: ${{ vars.NEXT_PUBLIC_EVENT_2026_PHOTOS_URL }}
          NEXT_PUBLIC_EVENT_2026_REDIRECT_URL: ${{ vars.NEXT_PUBLIC_EVENT_2026_REDIRECT_URL }}
          NEXT_PUBLIC_EVENT_2026_VIDEO_BASE_URL: ${{ vars.NEXT_PUBLIC_EVENT_2026_VIDEO_BASE_URL }}
          NEXT_PUBLIC_EVENT_2026_FEEDBACK_URL: ${{ vars.EVENT_2026_FEEDBACK_URL }}
          NEXT_PUBLIC_MEDIA_BASE_URL: ${{ vars.MEDIA_BASE_URL }}
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
